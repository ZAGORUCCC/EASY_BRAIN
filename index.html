<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Easy Brain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            background: #050505;
        }

        body {
            overflow: hidden;
        }


        /* =========================
           MAIN MENU
        ========================= */

        #menuScreen {
            display: block;

            position: relative;

            width: 100%;
            height: 100vh;

            background:
                radial-gradient(
                    circle at 75% 20%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 75%
                );
        }


        /* =========================
           BASIC CASE
        ========================= */

        .case-card {
            position: absolute;

            left: 12px;
            top: 20px;

            width: 170px;

            z-index: 1;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .case-card:active {
            transform: scale(0.97);
        }

        .case-image {
            display: block;

            width: 170px;
            height: auto;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 8px 10px
                    rgba(0, 0, 0, 0.65)
                );
        }


        /* =========================
           BOTTOM MENU
        ========================= */

        .bottom-menu {
            position: absolute;

            left: 50%;
            bottom: 35px;

            transform: translateX(-50%);

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 20px;

            width: max-content;

            z-index: 100;
        }

        .menu-button {
            border: none;

            background: transparent;

            color: white;

            font-size: 24px;
            font-weight: 600;

            padding: 8px 10px;

            cursor: pointer;

            -webkit-tap-highlight-color:
                rgba(0, 122, 255, 0.35);
        }

        .menu-button:active {
            background:
                rgba(0, 122, 255, 0.25);

            border-radius: 10px;
        }


        /* =========================
           CASE SCREEN
        ========================= */

        #caseScreen {
            display: none;

            position: relative;

            width: 100%;
            height: 100vh;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 78%
                );

            overflow-y: auto;
            overflow-x: hidden;

            overscroll-behavior: contain;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================
           CASE HEADER
        ========================= */

        .case-header {
            position: relative;

            width: 100%;
            height: 90px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .case-back-button {
            position: absolute;

            left: 16px;
            top: 18px;

            z-index: 20;

            border: none;

            background:
                rgba(0, 0, 0, 0.32);

            color: white;

            font-size: 19px;
            font-weight: 600;

            padding: 10px 14px;

            border-radius: 12px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .case-back-button:active {
            transform: scale(0.96);
        }


        /* =========================
           BALANCE
        ========================= */

        .balance-box {
            position: fixed;

            right: 16px;
            top: 18px;

            z-index: 1000;

            min-width: 105px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 7px;

            padding: 0 12px 0 15px;

            background:
                rgba(10, 7, 18, 0.82);

            border:
                1px solid
                rgba(150, 70, 255, 0.65);

            border-radius: 14px;

            box-shadow:
                0 0 14px
                rgba(120, 30, 255, 0.18);

            font-size: 21px;
            font-weight: 700;

            color: white;

            backdrop-filter: blur(5px);
        }

        .balance-coin {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ffe96a,
                    #ffb300
                );

            color: #17100a;

            font-size: 20px;
            font-weight: 900;

            box-shadow:
                inset 0 0 0 2px
                rgba(255, 255, 255, 0.25);
        }

        #balanceAmount {
            min-width: 18px;

            text-align: center;
        }

        .balance-topup {
            width: 32px;
            height: 32px;

            margin-left: 2px;

            border-radius: 50%;

            border: 1.5px solid
                rgba(160, 85, 255, 0.9);

            background:
                radial-gradient(
                    circle at 30% 30%,
                    rgba(140, 70, 220, 0.55),
                    rgba(60, 20, 110, 0.55)
                );

            color: #f0dcff;

            font-size: 22px;
            font-weight: 900;
            line-height: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;
            padding-bottom: 2px;

            cursor: pointer;

            box-shadow:
                0 0 10px rgba(140, 60, 255, 0.45),
                inset 0 0 6px rgba(190, 130, 255, 0.35);

            -webkit-tap-highlight-color: transparent;

            flex-shrink: 0;
        }

        .balance-topup:active {
            transform: scale(0.92);
        }


        /* =========================
           STARS TOP-UP OVERLAY
        ========================= */

        #starsOverlay {
            display: none;

            position: fixed;
            inset: 0;

            z-index: 5000;

            background: rgba(2, 0, 6, 0.78);

            align-items: center;
            justify-content: center;

            padding: 16px;

            backdrop-filter: blur(3px);
        }

        #starsOverlay.visible {
            display: flex;
        }

        .stars-panel {
            width: min(92vw, 400px);

            max-height: 90dvh;
            overflow-y: auto;

            background:
                linear-gradient(
                    160deg,
                    #170d24,
                    #0a0612
                );

            border: 1px solid #7d3fc0;

            border-radius: 20px;

            padding: 22px;

            color: #f4edff;

            box-shadow:
                0 15px 55px rgba(0, 0, 0, 0.75),
                0 0 30px rgba(120, 40, 200, 0.35);
        }

        .stars-head {
            display: flex;

            align-items: center;
            justify-content: space-between;

            margin-bottom: 18px;
        }

        .stars-head h2 {
            margin: 0;

            font-size: 21px;

            color: #e3c6ff;
        }

        #starsClose {
            width: 38px;
            height: 38px;

            border: 0;
            border-radius: 10px;

            background: #2a1440;

            color: #d9b8ff;

            font-size: 24px;
            font-weight: 800;

            cursor: pointer;

            flex-shrink: 0;
        }

        .stars-panel label {
            display: block;

            font-size: 14px;
            font-weight: 700;

            color: #cdb4eb;

            margin: 6px 0 8px;
        }

        .stars-input-wrap {
            position: relative;
        }

        #starsInput {
            width: 100%;

            padding: 15px 44px 15px 15px;

            border: 1px solid #7430bd;
            border-radius: 11px;

            background: #171222;
            color: white;

            font-size: 20px;
            font-weight: 800;

            outline: none;

            -moz-appearance: textfield;
        }

        #starsInput::-webkit-outer-spin-button,
        #starsInput::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        #starsInput:focus {
            border-color: #c184ff;
        }

        .stars-input-wrap::after {
            content: "⭐";

            position: absolute;

            right: 14px;
            top: 50%;

            transform: translateY(-50%);

            font-size: 20px;

            pointer-events: none;
        }

        .stars-rate-hint {
            margin: 10px 2px 0;

            font-size: 12.5px;

            color: #a895c4;
        }

        .stars-preview {
            margin-top: 18px;

            padding: 14px;

            border-radius: 12px;

            background:
                linear-gradient(
                    160deg,
                    #1e1030,
                    #140c22
                );

            border: 1px solid #5c2f8c;

            text-align: center;

            font-size: 17px;
            font-weight: 800;

            color: #e6d2ff;
        }

        .stars-preview strong {
            color: #ffd873;
        }

        .stars-confirm {
            width: 100%;

            margin-top: 16px;

            padding: 15px;

            border: 0;
            border-radius: 14px;

            background:
                linear-gradient(
                    180deg,
                    #34a5ec,
                    #0d6ec9
                );

            color: white;

            font-size: 18px;
            font-weight: 900;

            letter-spacing: 0.4px;

            cursor: pointer;

            box-shadow:
                0 6px 22px rgba(20, 110, 200, 0.5);
        }

        .stars-confirm:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .stars-confirm:active:not(:disabled) {
            transform: scale(0.98);
        }

        .stars-message {
            min-height: 18px;

            margin-top: 12px;

            text-align: center;

            font-size: 13px;
            font-weight: 700;

            color: #c7b8d9;
        }


        /* =========================
           OPEN AREA
        ========================= */

        .open-area {
            width: 100%;

            height: 62vh;
            min-height: 430px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: flex-end;

            padding: 0 0 22px 0;
        }


        /* =========================
           RANDOM BASE WINDOW
        ========================= */

        .base-showcase {
            position: relative;

            width: calc(100% - 24px);
            max-width: 620px;

            height: 235px;

            margin-bottom: 20px;

            overflow: hidden;

            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(42, 19, 67, 0.88),
                    rgba(12, 8, 18, 0.94)
                );

            border:
                1px solid
                rgba(161, 82, 255, 0.35);

            box-shadow:
                inset 0 0 35px
                rgba(107, 34, 174, 0.15),
                0 8px 28px
                rgba(0, 0, 0, 0.35);
        }


        /* =========================
           EDGE DARKENING
        ========================= */

        .base-showcase::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            background: linear-gradient(90deg,
                rgba(8, 5, 14, 1) 0%,
                rgba(8, 5, 14, .98) 12%,
                rgba(8, 5, 14, .76) 22%,
                rgba(8, 5, 14, 0) 38%,
                rgba(8, 5, 14, 0) 62%,
                rgba(8, 5, 14, .76) 78%,
                rgba(8, 5, 14, .98) 88%,
                rgba(8, 5, 14, 1) 100%);
        }

        .base-track {
            position: absolute;
            inset: 0 auto 0 0;
            display: flex;
            align-items: center;
            gap: 0;
            width: max-content;
            height: 100%;
            will-change: transform;
        }
        .base-track img {
            display: block;
            flex: 0 0 160px;
            width: 160px;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,.4));
        }

        .center-pointer {
            position: absolute;

            left: 50%;
            top: 0;

            width: 4px;
            height: 100%;

            transform: translateX(-50%);

            z-index: 100;

            pointer-events: none;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #bca4ff 22%,
                    #8a5cff 50%,
                    #65c7ff 78%,
                    #ffffff 100%
                );

            box-shadow:
                0 0 5px rgba(255,255,255,.95),
                0 0 12px rgba(130,88,255,.95),
                0 0 22px rgba(70,160,255,.60);
        }

        .center-pointer::before {
            content: "";

            position: absolute;

            left: 50%;
            top: 0;

            transform: translateX(-50%);

            width: 0;
            height: 0;

            border-left: 18px solid transparent;
            border-right: 18px solid transparent;

            border-top: 24px solid #ffffff;

            filter:
                drop-shadow(
                    0 4px 5px
                    rgba(126, 92, 255, 0.85)
                );
        }

        .center-pointer::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 0;

            transform: translateX(-50%);

            width: 0;
            height: 0;

            border-left: 18px solid transparent;
            border-right: 18px solid transparent;

            border-bottom: 24px solid #ffffff;

            filter:
                drop-shadow(
                    0 -4px 5px
                    rgba(85, 164, 255, 0.85)
                );
        }


        /* =========================
           OPEN BUTTON
        ========================= */

        .open-case-button {
            border: none;
            outline: none;

            background: transparent;

            padding: 0;
            margin: 0;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .open-case-button img {
            display: block;

            width: 150px;
            height: auto;

            object-fit: contain;
        }

        .open-case-button:active {
            transform: scale(0.94);
        }


        /* =========================
           BASE GRID
        ========================= */

        .bases-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            width: 100%;

            padding:
                0
                12px
                30px;
        }

        .base-item {
            width: 100%;

            overflow: hidden;

            border-radius: 12px;
        }

        .base-item img {
            display: block;

            width: 100%;
            height: auto;

            border-radius: 12px;
        }


        /* =========================
           PROFILE
        ========================= */

        #profileScreen {
            overflow-y: auto;
            display: none;

            position: relative;

            width: 100%;
            height: 100vh;

            padding:
                35px
                25px;

            background:
                radial-gradient(
                    circle at 75% 20%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 75%
                );

            color: white;
        }

        .profile-box {
            display: flex;

            align-items: center;

            margin-top: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #333;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 36px;
            font-weight: bold;

            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .profile-user-info {
            margin-left: 20px;
        }

        .username {
            font-size: 27px;

            font-weight: bold;
        }

        .easy-brain-id {
            margin-top: 7px;

            font-size: 16px;
            font-weight: 600;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );
        }


        .back-button {
            display: inline-block;

            margin-top: 40px;

            color: white;

            font-size: 20px;
            font-weight: 600;

            background: transparent;

            border: none;

            padding: 0;

            cursor: pointer;
        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 430px) {

            .base-showcase {
                height: 215px;
            }

            .center-pointer {
                width: 3px;
            }

            .center-pointer::before {
                border-left-width: 15px;
                border-right-width: 15px;
                border-top-width: 21px;
            }

            .center-pointer::after {
                border-left-width: 15px;
                border-right-width: 15px;
                border-bottom-width: 21px;
            }

        }


        /* CASE OPENING + INVENTORY */
        .case-actions { display:flex; flex-direction:column; align-items:center; gap:7px; width:100%; }
        .case-cost { color:#bba7d0; font-size:13px; font-weight:700; }
        .case-error { min-height:17px; color:#ff566b; font-size:13px; font-weight:700; text-align:center; }
        .case-result { min-height:22px; color:#e9d6ff; font-size:15px; font-weight:700; text-align:center; }
        .case-sell, .inventory-sell { border:0; border-radius:10px; padding:10px 22px; background:#d82041; color:white; font-weight:800; cursor:pointer; }
        .case-sell:disabled, .inventory-sell:disabled { opacity:.5; cursor:wait; }
        .open-case-button:disabled { opacity:.55; cursor:wait; }
        .inventory-section { margin-top:26px; padding-bottom:90px; }
        .inventory-section h3 { margin:0 0 14px; font-size:21px; }
        .inventory-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
        .inventory-card { background:#140e20; border:1px solid #643c8a; border-radius:14px; padding:9px; text-align:center; }
        .inventory-card img { width:100%; height:135px; object-fit:contain; }
        .inventory-card strong { display:block; font-size:14px; margin:6px 0 9px; }
        .inventory-sell { font-size:13px; padding:9px 12px; }
        .inventory-status { color:#bba7d0; font-size:13px; margin:10px 0; }
        /* EASY BRAIN ADMIN PANEL */
        #adminOrb { display:none; position:fixed; left:calc(50% - 23px); top:78px; width:46px; height:46px; z-index:3000; border-radius:50%; border:1px solid #8751d5; background:#09070e; color:#bb74ff; box-shadow:0 0 15px #7c39d870; align-items:center; justify-content:center; cursor:grab; touch-action:none; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; padding:0; }
        #adminOrb svg { width:26px; height:26px; pointer-events:none; filter:drop-shadow(0 0 5px #ad62ff); }
        #adminOrb.dragging { cursor:grabbing; }
        #adminOverlay { display:none; position:fixed; inset:0; z-index:4000; background:rgba(0,0,0,.64); align-items:center; justify-content:center; padding:16px; }
        #adminOverlay.visible { display:flex; }
        .admin-panel { width:min(92vw,510px); max-height:90dvh; overflow-y:auto; background:#09080e; color:#f4edff; border:1px solid #7231a8; border-radius:19px; box-shadow:0 15px 55px #000b, 0 0 25px #6d21aa40; padding:22px; }
        .admin-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; }
        .admin-head h2 { margin:0; font-size:26px; color:#e3c6ff; }
        #adminClose { width:39px; height:39px; border:0; border-radius:10px; background:#df1735; color:white; font-size:28px; font-weight:800; cursor:pointer; }
        .admin-tabs { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:20px; }
        .admin-tab { border:1px solid #693b94; background:#1a1028; color:#d6c2ec; padding:12px 6px; border-radius:11px; font-weight:800; font-size:15px; cursor:pointer; }
        .admin-tab.active { background:#6325a0; border-color:#d4a2ff; color:white; }
        .admin-panel label { display:block; font-size:16px; font-weight:700; margin:17px 0 8px; }
        .admin-panel input { width:100%; padding:15px; border:1px solid #7430bd; border-radius:11px; background:#171222; color:white; font-size:17px; outline:none; }
        .admin-panel input:focus { border-color:#c184ff; }
        .admin-bottom { display:flex; justify-content:flex-end; margin-top:25px; }
        #adminStart { border:0; border-radius:11px; background:linear-gradient(#0bd55e,#02963d); color:white; padding:13px 31px; font-size:19px; font-weight:800; cursor:pointer; }
        #adminStart:disabled { opacity:.55; cursor:wait; }
        #adminMessage { min-height:20px; font-size:14px; line-height:1.4; margin-top:15px; color:#c7b8d9; }
        .admin-webhook-block { margin-top:18px; padding-top:16px; border-top:1px solid #3a2348; }
        .admin-webhook-button { width:100%; border:0; border-radius:11px; background:linear-gradient(#4b8fe0,#2660b5); color:white; padding:13px 18px; font-size:16px; font-weight:800; cursor:pointer; }
        .admin-webhook-button:disabled { opacity:.55; cursor:wait; }
        .admin-webhook-status { margin-top:10px; font-size:13px; color:#c7b8d9; min-height:18px; word-break:break-all; }
        #adminPromoStart { border:0; border-radius:11px; background:linear-gradient(#0bd55e,#02963d); color:white; padding:13px 31px; font-size:19px; font-weight:800; cursor:pointer; }
        #adminPromoStart:disabled { opacity:.55; cursor:wait; }
        #adminPromoMessage { min-height:20px; font-size:14px; line-height:1.4; margin-top:15px; color:#c7b8d9; }

        /* PROMO CODE (profile) */
        .promo-section { margin-top:26px; padding-bottom:90px; }
        .promo-section h3 { margin:0 0 12px; font-size:19px; }
        .promo-row { display:flex; gap:9px; align-items:stretch; }
        #promoInput { flex:1; min-width:0; padding:14px 14px; border:2px solid #2660b5; border-radius:12px; background:#0e1524; color:white; font-size:16px; font-weight:700; outline:none; letter-spacing:1px; }
        #promoInput:focus { border-color:#4b8fe0; box-shadow:0 0 10px rgba(75,143,224,0.45); }
        #promoSubmit { border:2px solid #2660b5; border-radius:12px; background:linear-gradient(#4b8fe0,#2660b5); color:white; padding:0 22px; font-size:16px; font-weight:900; cursor:pointer; white-space:nowrap; }
        #promoSubmit:disabled { opacity:.55; cursor:wait; }
        #promoSubmit:active:not(:disabled) { transform:scale(0.97); }
        #promoMessage { min-height:18px; margin-top:10px; font-size:13.5px; font-weight:700; color:#c7b8d9; }
        #promoMessage.ok { color:#5ee08a; }
        #promoMessage.err { color:#ff6b7d; }


        /* UPGRADE SCREEN — isolated from case roulette */
        #upgradeScreen{display:none;position:relative;width:100%;height:100dvh;overflow-y:auto;color:#f5efff;background:radial-gradient(circle at 50% 12%,#411663 0%,#170c29 42%,#050505 85%);padding:86px 14px 38px;overscroll-behavior:contain}
        .upgrade-back{position:absolute;top:20px;left:16px;background:#1c102b;border:1px solid #8145bb;border-radius:12px;color:white;padding:11px 16px;font-weight:800;font-size:17px}
        .upgrade-heading{text-align:center;font-size:26px;font-weight:900;letter-spacing:1px;color:#eee0ff;text-shadow:0 0 18px #974cff}
        .upgrade-wheel-wrap{position:relative;width:min(74vw,292px);aspect-ratio:1;margin:16px auto 19px}
        .upgrade-wheel{width:100%;height:100%;border-radius:50%;border:5px solid #2b173f;box-shadow:0 0 0 2px #9b56dc,0 0 32px #7133c655,inset 0 0 16px #000a;background:conic-gradient(from 0deg,#e33c50 0deg var(--green-start,180deg),#22cb68 var(--green-start,180deg) var(--green-end,180deg),#e33c50 var(--green-end,180deg) 360deg);position:relative}

    <script type="module">
      const $ = id => document.getElementById(id);
      const menu = $("menuScreen"), profile = $("profileScreen"), casePage = $("caseScreen");
      const showcase = $("baseShowcase"), track = $("baseTrack");
      const idLabel = $("easyBrainId"), balanceLabel = $("balanceAmount");
      const cfg = window.EASY_BRAIN_CONFIG;

      const INVENTORY_LIMIT = 10;

      const images = [
        "tralalelo-base-clean.png", "rose-base-clean.png",
        "aquatic-base-clean.png", "honey-bee-base-clean.png",
        "bunny-basket-base-clean.png", "taco-base-clean.png",
        "easter-base-clean.png", "lucky-base-clean.png"
      ];
      images.forEach(src => { const img = new Image(); img.src = src; });
      let previous = -1;
      function nextImage() {
        let index = Math.floor(Math.random() * images.length);
        if (index === previous) index = (index + 1) % images.length;
        previous = index;
        return images[index];
      }

      const ITEM_WIDTH = 160;
      const SPEED = 95;
      let animationFrame = null, lastFrame = 0, offset = 0;
      function addImage() {
        const image = document.createElement("img");
        image.src = nextImage();
        image.alt = "Base";
        image.draggable = false;
        track.appendChild(image);
      }
      function fillTrack() {
        const required = Math.ceil(showcase.clientWidth / ITEM_WIDTH) + 3;
        while (track.children.length < required) addImage();
      }
      function frame(time) {
        if (lastFrame) offset += SPEED * Math.min((time - lastFrame) / 1000, .05);
        lastFrame = time;
        while (offset >= ITEM_WIDTH) {
          offset -= ITEM_WIDTH;
          track.firstElementChild?.remove();
          addImage();
        }
        fillTrack();
        track.style.transform = `translate3d(${-offset}px, 0, 0)`;
        animationFrame = requestAnimationFrame(frame);
      }
      function startShowcase() {
        stopShowcase();
        track.style.transition = "none";
        offset = 0;
        track.style.transform = "translate3d(0,0,0)";
        fillTrack();
        animationFrame = requestAnimationFrame(frame);
      }
      function stopShowcase() {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        lastFrame = 0;
        track.style.transition = "none";
        track.replaceChildren();
      }

      $("basicCase").addEventListener("click", () => {
        menu.style.display = "none";
        profile.style.display = "none";
        casePage.style.display = "block";
        casePage.scrollTop = 0;
        if (!spinning) { resetCasePresentation(); startShowcase(); updateCaseCountAvailability(); }
      });
      $("caseBackButton").addEventListener("click", () => {
        if (spinning) return;
        resetCasePresentation();
        stopShowcase();
        casePage.style.display = "none";
        menu.style.display = "block";

      $("profileButton").addEventListener("click", () => {
        stopShowcase();
        menu.style.display = "none";
        casePage.style.display = "none";
        profile.style.display = "block";
      });
      $("backButton").addEventListener("click", () => {
        profile.style.display = "none";
        menu.style.display = "block";
      });
      const BASES = {
        tralalelo: {name:"Tralalelo Base", price:30, image:"tralalelo-base-clean.png", weight:5},
        rose: {name:"Rose Base", price:26, image:"rose-base-clean.png", weight:10},
        aquatic: {name:"Aquatic Base", price:19, image:"aquatic-base-clean.png", weight:20},
        honey_bee: {name:"Honey Bee Base", price:16, image:"honey-bee-base-clean.png", weight:30},
        bunny_basket: {name:"Bunny Basket Base", price:12, image:"bunny-basket-base-clean.png", weight:50},
        taco: {name:"Taco Base", price:9, image:"taco-base-clean.png", weight:55},
        easter: {name:"Easter Base", price:7, image:"easter-base-clean.png", weight:65},
        lucky: {name:"Lucky Base", price:5, image:"lucky-base-clean.png", weight:75}
      };
      const baseKeys = Object.keys(BASES);
      let currentBalance = 0, spinning = false, wonItem = null, inventoryItems = [];
      let inventoryReady = false;
      const caseError = $("caseError"), caseResult = $("caseResult"), caseSell = $("caseSell");
      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      function renderInventory() {
        const grid = $("inventoryGrid"), status = $("inventoryStatus");
        grid.replaceChildren();
        status.textContent = !inventoryReady
          ? "Завантаження..."
          : `Баз у колекції: ${inventoryItems.length} / ${INVENTORY_LIMIT}`;
        for (const item of inventoryItems) {
          const base = BASES[item.baseId];
          if (!base) continue;
          const card = document.createElement("article"); card.className = "inventory-card";
          const img = document.createElement("img"); img.src = base.image; img.alt = base.name;
          const title = document.createElement("strong"); title.textContent = base.name;
          const sell = document.createElement("button"); sell.className = "inventory-sell";
          sell.textContent = `Продати — ${base.price} E`;
          sell.addEventListener("click", () => sellItem(item.id, sell));
          card.append(img, title, sell); grid.append(card);
        }
        updateCaseCountAvailability();
      }
      async function gameRequest(path, payload={}) {
        if (!tg?.initData) throw new Error("Відкрий гру через Telegram");
        const res = await fetch(cfg.workerUrl.replace(/\/$/, "") + path, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({initData:tg.initData,...payload})
        });
        const data = await res.json().catch(()=>({}));
        if (!res.ok) {
          if (res.status === 402 || data.code === "INSUFFICIENT_BALANCE") throw new Error("Недостатньо балансу");
          throw new Error(data.error || `Помилка сервера (${res.status})`);
        }
        return data;
      }
      async function sellItem(itemId, button) {
        if (!itemId || button.disabled) return;
        button.disabled = true;
        try {
          const result = await gameRequest("/case/sell", {itemId});
          if (wonItem?.id === itemId) { wonItem = null; caseSell.style.display="none"; }
          caseResult.textContent = `Продано! +${result.price} E`;
        } catch (error) { caseError.textContent = error.message; }
        finally { button.disabled = false; }
      }
      caseSell.addEventListener("click", () => { if (wonItem) sellItem(wonItem.id, caseSell); });
      async function animateWin(baseId) {
        stopShowcase();
        const winner = BASES[baseId];
        const winIndex = 38, total = 45;
        for (let i=0; i<total; i++) {
          const key = i===winIndex ? baseId : baseKeys[Math.floor(Math.random()*baseKeys.length)];
          const img = document.createElement("img"); img.src=BASES[key].image;

      async function makeEasyBrainId(uid) {
        const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(uid)));
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", digits = "0123456789";
        return letters[hash[0] % 26] + letters[hash[1] % 26] +
          digits[hash[2] % 10] + letters[hash[3] % 26] +
          digits[hash[4] % 10] + letters[hash[5] % 26] + digits[hash[6] % 10];
      }

      async function connectFirebase() {
        idLabel.textContent = "ID: підключення...";
        balanceLabel.textContent = "0";
        if (!tg?.initData || !tgUser) {
          idLabel.textContent = "ID: відкрийте через Telegram";

          idLabel.textContent = "ID: налаштуйте Firebase";
          return;
        }
        try {
          const [{ initializeApp }, auth, firestore] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js"),
            import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js")
          ]);
          const app = initializeApp(cfg.firebase);
          const response = await fetch(cfg.workerUrl.replace(/\/$/, "") + "/auth/telegram", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData: tg.initData })
          });
          if (!response.ok) throw new Error("Telegram API: " + response.status);
          const result = await response.json();
          if (!result.verified || !result.customToken) throw new Error("Немає Firebase token");
          const credential = await auth.signInWithCustomToken(auth.getAuth(app), result.customToken);
          const uid = credential.user.uid;
          const db = firestore.getFirestore(app);
          const userDoc = firestore.doc(db, "users", uid);
          const snapshot = await firestore.getDoc(userDoc);
          if (!snapshot.exists()) {
            await firestore.setDoc(userDoc, {
              easyBrainId: await makeEasyBrainId(uid),
              balance: 0
            });
          }
          const itemsCollection = firestore.collection(db, "users", uid, "items");
          firestore.onSnapshot(itemsCollection, snap => {
            inventoryItems = snap.docs.map(d => ({id:d.id, ...d.data()}));
            inventoryReady = true; renderInventory();
             if (upgradeSource && !inventoryItems.some(i=>i.id===upgradeSource) && !upgradeBusy) {upgradeSource=null;upgradeTarget=null;upgradeAllowed=[];++upgradeRequestNumber;}
             if (!upgradeBusy) {upgradeDisplay();upgradeRender();}
          }, err => { console.error("Inventory:",err); $("inventoryStatus").textContent="Помилка завантаження інвентарю"; });
          firestore.onSnapshot(userDoc, snap => {
            if (!snap.exists()) return;
            const data = snap.data();
            idLabel.textContent = "ID: " + (data.easyBrainId || "-------");
            currentBalance = Number(data.balance ?? 0);
            balanceLabel.textContent = String(currentBalance);
          }, error => {
            console.error("Firestore:", error);
            idLabel.textContent = "ID: помилка доступу";
          });
        } catch (error) {
          console.error("Easy Brain login:", error);
          idLabel.textContent = "ID: помилка підключення";
        }
      }


      // UPGRADE
      const upgradePage = $("upgradeScreen"), upgradeWheel = $("upgradeWheel"), upgradePointer = document.querySelector("#upgradeScreen .upgrade-pointer");
      let upgradeSource = null, upgradeTarget = null, upgradeTab = "own";
      let upgradeBusy = false, upgradeAllowed = [], upgradeRequestNumber = 0;
      let upgradeRotation = 0;
      const upgradeMessage = $("upgradeMessage");
      const upgradePercent = $("upgradePercent");
      function upgradeSlot(id, baseId) {
        const slot = $(id); slot.replaceChildren();
        const base = BASES[baseId];
        if (!base) { slot.textContent = "Вибери предмет"; return; }
        const img = document.createElement("img"); img.src = base.image; img.alt = base.name;
        const label = document.createElement("div"); label.className = "upgrade-slot-name";
        label.textContent = `${base.name} · ${base.price} E`;

      function upgradeChance() {
        if (!upgradeSource || !upgradeTarget) return 0;
        const own = inventoryItems.find(i => i.id === upgradeSource);
        const source = BASES[own?.baseId], target = BASES[upgradeTarget];
        return source && target && target.price > source.price
          ? Math.floor(source.price * 10000 / target.price) : 0;
      }
      function upgradeSetSector(chanceBps) {
        const halfAngle = chanceBps * 360 / 10000 / 2;
        upgradeWheel.style.setProperty("--green-start", `${180-halfAngle}deg`);
        upgradeWheel.style.setProperty("--green-end", `${180+halfAngle}deg`);
      }
      function upgradeDisplay() {
        const own = inventoryItems.find(i => i.id === upgradeSource);
        upgradeSlot("upgradeSourceSlot",own?.baseId);
        upgradeSlot("upgradeTargetSlot",upgradeTarget);
        const chance = upgradeChance();
        const valid = chance > 0 && chance <= 7500 && upgradeAllowed.some(x=>x.id===upgradeTarget);
        upgradeSetSector(valid ? chance : 0);
        upgradePercent.textContent = valid ? `Шанс успіху: ${(chance/100).toLocaleString("uk-UA",{maximumFractionDigits:2})}%` : (own ? "Вибери бажану базу" : "Вибери свою базу");
        $("upgradePlay").disabled = !valid || upgradeBusy || !inventoryReady;
      }
      async function upgradeLoadOptions() {
        const requestId = ++upgradeRequestNumber;
        upgradeAllowed = [];
        if (!upgradeSource) { upgradeDisplay(); upgradeRender(); return; }
        const own = inventoryItems.find(i=>i.id===upgradeSource);
        if (!own) { upgradeSource=null; upgradeTarget=null; upgradeDisplay(); upgradeRender(); return; }
        try {
          const data = await gameRequest("/upgrade/options",{sourceBaseId:own.baseId});
          if (requestId !== upgradeRequestNumber) return;
          upgradeAllowed = Array.isArray(data.targets) ? data.targets : [];
          if (!upgradeAllowed.some(x=>x.id===upgradeTarget)) upgradeTarget=null;
        } catch(err) { if (requestId===upgradeRequestNumber) upgradeMessage.textContent=err.message; }
        if (requestId === upgradeRequestNumber) { upgradeDisplay(); upgradeRender(); }
      }
      function upgradeRender() {
        const list = $("upgradeList"); list.replaceChildren();
        $("upgradeOwnTab").classList.toggle("active",upgradeTab==="own");
        $("upgradeWishTab").classList.toggle("active",upgradeTab==="wish");
        let entries = upgradeTab==="own"
          ? inventoryItems.filter(i=>BASES[i.baseId]).map(i=>({itemId:i.id,baseId:i.baseId}))
          : (upgradeSource ? upgradeAllowed.map(b=>({baseId:b.id})) : baseKeys.map(baseId=>({baseId})));
        if (!entries.length) {
          const empty=document.createElement("div"); empty.className="upgrade-empty";
          empty.textContent=upgradeTab==="own" ? (inventoryReady?"У тебе поки немає баз":"Завантаження інвентарю...") : "Немає доступних баз для покращення";
          list.append(empty); return;
        }
        for (const entry of entries) {
          const base=BASES[entry.baseId];
          const button=document.createElement("button"); button.type="button";
          button.className="upgrade-item";
          if (upgradeTab==="own" ? upgradeSource===entry.itemId : upgradeTarget===entry.baseId) button.classList.add("selected");
          button.disabled=upgradeBusy;
          const img=document.createElement("img"); img.src=base.image; img.alt=base.name;
          const name=document.createElement("strong"); name.textContent=base.name;
          const price=document.createElement("span"); price.textContent=`${base.price} E`;
          button.append(img,name,price);
          button.addEventListener("click",()=>{
            if (upgradeBusy) return;
            upgradeMessage.textContent="";
            if (upgradeTab==="own") {
              upgradeSource=entry.itemId; upgradeTarget=null; upgradeTab="wish";
              upgradeDisplay(); upgradeRender(); upgradeLoadOptions();
            } else {
              if (upgradeSource && !upgradeAllowed.some(x=>x.id===entry.baseId)) return;
              upgradeTarget=entry.baseId; upgradeDisplay(); upgradeRender();
            }
          });
          list.append(button);
        }
      }
      function upgradeOpen() {
        if (upgradeBusy) return;
        menu.style.display="none"; casePage.style.display="none"; profile.style.display="none";
        upgradePage.style.display="block"; upgradePage.scrollTop=0;
        upgradeMessage.textContent="";
        upgradeTab="own"; upgradeDisplay(); upgradeRender();
        if (upgradeSource) upgradeLoadOptions();
      }
      $("upgradeButton").addEventListener("click",upgradeOpen);
      $("upgradeBack").addEventListener("click",()=>{
        if (upgradeBusy) return;
        upgradePage.style.display="none"; menu.style.display="block";
      });
      $("upgradeOwnTab").addEventListener("click",()=>{if(!upgradeBusy){upgradeTab="own";upgradeRender();}});
      $("upgradeWishTab").addEventListener("click",()=>{if(!upgradeBusy){upgradeTab="wish";upgradeRender();}});
      function upgradeAnimate(won,chanceBps) {
        const halfAngle = chanceBps * 360 / 10000 / 2;
        const greenStart = 180 - halfAngle;
        const greenEnd = 180 + halfAngle;
        const margin = Math.min(4, halfAngle / 3);
        const random = () => {
          const bytes = new Uint32Array(1);
          crypto.getRandomValues(bytes);
          return bytes[0] / 4294967296;
        };
        let destination;
        if (won) {
          destination = greenStart + margin + random() * (greenEnd - greenStart - 2 * margin);
        } else {
          const redLeftEnd = greenStart - margin;
          const redRightStart = greenEnd + margin;
          const leftLength = redLeftEnd;
          const rightLength = 360 - redRightStart;
          const point = random() * (leftLength + rightLength);
          destination = point < leftLength ? point : redRightStart + point - leftLength;
        }
        const normalized = ((upgradeRotation % 360) + 360) % 360;
        const delta = (destination - normalized + 360) % 360;
        upgradeRotation += 360 * 6 + delta;
        upgradePointer.style.transition = "transform 5100ms cubic-bezier(.12,.72,.12,1)";
        upgradePointer.style.transform = `rotate(${upgradeRotation}deg)`;
        return sleep(5250);
      }
      $("upgradePlay").addEventListener("click",async()=>{
        if (upgradeBusy || !upgradeSource || !upgradeTarget) return;
        const chance=upgradeChance();
        if (!chance || chance>7500 || !upgradeAllowed.some(x=>x.id===upgradeTarget)) return;
        upgradeBusy=true; upgradeDisplay(); upgradeRender();
        upgradeMessage.textContent="Перевіряємо покращення...";
        const itemId=upgradeSource, targetBaseId=upgradeTarget;
        try {
          const result=await gameRequest("/upgrade/play",{itemId,targetBaseId});
          if (result.success!==true || typeof result.won!=="boolean" || !Number.isInteger(result.chanceBps)) throw new Error("Некоректна відповідь сервера");
          upgradeSetSector(result.chanceBps);
          upgradeMessage.textContent="Колесо крутиться...";
          await upgradeAnimate(result.won,result.chanceBps);
          upgradeMessage.textContent=result.won ? `УСПІХ! Отримано ${BASES[targetBaseId]?.name || "базу"}! 💚` : "Не вдалося. Поставлену базу втрачено.";
          upgradeSource=null; upgradeTarget=null; upgradeAllowed=[]; ++upgradeRequestNumber;
        } catch(err) { upgradeMessage.textContent=err.message; }
        finally {upgradeBusy=false; upgradeDisplay(); upgradeRender();}

      // ADMIN
      const adminOrb = $("adminOrb"), adminOverlay = $("adminOverlay");
      const adminForm = $("adminForm"), adminMessage = $("adminMessage");
      let adminAuthorized = false;
      const adminApi = path => cfg.workerUrl.replace(/\/$/, "") + path;
      async function adminRequest(path, extra = {}) {
        const response = await fetch(adminApi(path), {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData, ...extra })

      let drag = null;
      let lastTouchAt = 0;
      let suppressClickUntil = 0;
      function openAdminPanel() {
        if (!adminAuthorized) return;
        adminMessage.textContent = "";
        adminOverlay.classList.add("visible");
        setAdminTab("topup");
      }
      function beginOrbDrag(x, y) {
        if (!adminAuthorized) return;
        drag = {
          x, y, left: adminOrb.offsetLeft, top: adminOrb.offsetTop,
          moved: false
        };
      }
      function moveOrbDrag(x, y) {
        if (!drag) return;
        const dx = x - drag.x, dy = y - drag.y;
        if (Math.hypot(dx, dy) > 9) drag.moved = true;
        if (!drag.moved) return;
        adminOrb.classList.add("dragging");
        const left = Math.max(0, Math.min(window.innerWidth - adminOrb.offsetWidth, drag.left + dx));
        const top = Math.max(0, Math.min(window.innerHeight - adminOrb.offsetHeight, drag.top + dy));
        adminOrb.style.left = left + "px";
        adminOrb.style.top = top + "px";
      }
      function finishOrbDrag() {
        if (!drag) return;
        const wasMoved = drag.moved;
        drag = null;
        adminOrb.classList.remove("dragging");
        suppressClickUntil = Date.now() + 650;
        if (!wasMoved) openAdminPanel();
      }
      adminOrb.addEventListener("touchstart", e => {
        if (!adminAuthorized || e.touches.length !== 1) return;
        lastTouchAt = Date.now();
        const t = e.touches[0];
        beginOrbDrag(t.clientX, t.clientY);
      }, { passive: true });
      adminOrb.addEventListener("touchmove", e => {
        if (!drag || e.touches.length !== 1) return;
        const t = e.touches[0];
        moveOrbDrag(t.clientX, t.clientY);
        if (drag.moved) e.preventDefault();
      }, { passive: false });
      adminOrb.addEventListener("touchend", e => {
        if (!drag) return;
        lastTouchAt = Date.now();
        e.preventDefault();
        finishOrbDrag();
      }, { passive: false });
      adminOrb.addEventListener("touchcancel", () => {
        drag = null;
        adminOrb.classList.remove("dragging");
      });
      adminOrb.addEventListener("pointerdown", e => {
        if (e.pointerType === "touch" || Date.now() - lastTouchAt < 800) return;
        if (e.button !== 0) return;
        beginOrbDrag(e.clientX, e.clientY);
        try { adminOrb.setPointerCapture(e.pointerId); } catch (_) {}
      });
      adminOrb.addEventListener("pointermove", e => {
        if (e.pointerType === "touch") return;
        moveOrbDrag(e.clientX, e.clientY);
      });
      adminOrb.addEventListener("pointerup", e => {
        if (e.pointerType === "touch") return;
        finishOrbDrag();
      });
      adminOrb.addEventListener("pointercancel", e => {
        if (e.pointerType === "touch") return;
        drag = null;
        adminOrb.classList.remove("dragging");
      });

        if (Date.now() >= suppressClickUntil) openAdminPanel();

      adminForm.addEventListener("submit", async e => {

        adminMessage.textContent = "Нарахування...";

          adminMessage.textContent = `Готово! Додано ${amount} E. Новий баланс: ${result.balance} E.`;
        } catch (err) { adminMessage.textContent = "Помилка: " + err.message; }
        finally { button.disabled = false; }
      });

      const adminPromoForm = $("adminPromoForm"), adminPromoMessage = $("adminPromoMessage");
      adminPromoForm.addEventListener("submit", async e => {
        e.preventDefault();
        if (!adminAuthorized) return;
        const name = $("promoName").value.trim();
        const uses = Number($("promoUses").value);
        const coins = Number($("promoCoins").value);
        if (!/^[A-Za-z0-9]{3,20}$/.test(name)) {
          adminPromoMessage.textContent = "Назва: лише латиниця та цифри, 3–20 символів, без пробілів.";
          return;
        }
        if (!Number.isSafeInteger(uses) || uses < 1 || uses > 1000000) {
          adminPromoMessage.textContent = "Кількість активацій: ціле число 1–1 000 000.";
          return;
        }
        if (!Number.isSafeInteger(coins) || coins < 1 || coins > 1000000) {
          adminPromoMessage.textContent = "Кількість E-коїнів: ціле число 1–1 000 000.";
          return;
        }
        const button = $("adminPromoStart"); button.disabled = true;
        adminPromoMessage.textContent = "Створюємо промокод...";
        try {
          const result = await adminRequest("/admin/create-promo", { name, uses, coins });
          adminPromoMessage.textContent = `Готово! Промокод ${result.code}: ${result.usesLeft} активацій × ${result.coins} E.`;
          $("promoName").value = ""; $("promoUses").value = ""; $("promoCoins").value = "";
        } catch (err) { adminPromoMessage.textContent = "Помилка: " + err.message; }
        finally { button.disabled = false; }
      });

      $("adminSetupWebhook").addEventListener("click", async () => {
        if (!adminAuthorized) return;
        const button = $("adminSetupWebhook"), status = $("adminWebhookStatus");
        button.disabled = true;
        status.textContent = "Надсилаємо запит до Telegram...";
        try {
          const result = await adminRequest("/admin/setup-webhook");
          status.textContent = "Готово: " + (result.webhookUrl || "webhook зареєстровано");
        } catch (err) { status.textContent = "Помилка: " + err.message; }
        finally { button.disabled = false; }
      });

      // PROMO REDEEM (profile)
      const promoInput = $("promoInput"), promoSubmit = $("promoSubmit"), promoMessage = $("promoMessage");
      function setPromoMessage(text, kind) {
        promoMessage.textContent = text;
        promoMessage.classList.remove("ok","err");
        if (kind) promoMessage.classList.add(kind);
      }
      async function redeemPromo() {
        const code = promoInput.value.trim();
        if (!/^[A-Za-z0-9]{3,20}$/.test(code)) {
          setPromoMessage("Промокод: лише латиниця та цифри, 3–20 символів.", "err");
          return;
        }
        promoSubmit.disabled = true;
        setPromoMessage("Перевіряємо...", null);
        try {
          const result = await gameRequest("/promo/redeem", { code });
          if (result.success) {
            setPromoMessage(`Готово! +${result.coins} E`, "ok");
            promoInput.value = "";
          } else {
            setPromoMessage(result.error || "Помилка", "err");
          }
        } catch (err) {
          setPromoMessage(err.message, "err");
        } finally {
          promoSubmit.disabled = false;
        }
      }
      promoSubmit.addEventListener("click", redeemPromo);
      promoInput.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); redeemPromo(); }
      });


      // STARS TOP-UP
      const starsOverlay = $("starsOverlay");
      const starsInput = $("starsInput");
      const starsPreview = $("starsPreview");
      const starsMessage = $("starsMessage");
      const starsConfirm = $("starsConfirm");
      const STARS_MIN = 1;
      const STARS_MAX = 10000;

      function coinsForStars(stars) {
        return Math.round(stars * 5 / 4);
      }
      function starsValid(stars) {
        return Number.isSafeInteger(stars) && stars >= STARS_MIN && stars <= STARS_MAX;
      }
      function updateStarsPreview() {
        const stars = Number(starsInput.value);
        if (!starsValid(stars)) {
          starsPreview.innerHTML = "Введи число від " + STARS_MIN + " до " + STARS_MAX.toLocaleString("uk-UA");
          starsConfirm.disabled = true;
          return;
        }
        const coins = coinsForStars(stars);
        starsPreview.innerHTML = `Ти отримаєш <strong>${coins}</strong> E-коїн${coins === 1 ? "" : coins < 5 ? "и" : "ів"}`;
        starsConfirm.disabled = false;
      }
      function openStarsPanel() {
        if (!tg?.initData) return;
        starsMessage.textContent = "";
        starsOverlay.classList.add("visible");
        updateStarsPreview();
      }
      function closeStarsPanel() {
        starsOverlay.classList.remove("visible");
        starsMessage.textContent = "";
      }
      $("balanceTopUp").addEventListener("click", openStarsPanel);
      $("starsClose").addEventListener("click", closeStarsPanel);
      starsOverlay.addEventListener("click", e => { if (e.target === starsOverlay) closeStarsPanel(); });
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && starsOverlay.classList.contains("visible")) closeStarsPanel();
      });
      starsInput.addEventListener("input", updateStarsPreview);

      async function starsRequest(path, payload = {}) {
        if (!tg?.initData) throw new Error("Відкрий гру через Telegram");
        const res = await fetch(cfg.workerUrl.replace(/\/$/, "") + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData, ...payload })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Помилка сервера (${res.status})`);
        return data;
      }

      starsConfirm.addEventListener("click", async () => {
        if (starsConfirm.disabled) return;
        const stars = Number(starsInput.value);
        if (!starsValid(stars)) return;
        if (typeof tg.openInvoice !== "function") {
          starsMessage.textContent = "Онови Telegram до останньої версії, щоб оплатити.";
          return;
        }
        starsConfirm.disabled = true;
        starsMessage.textContent = "Створюємо рахунок...";
        try {
          const data = await starsRequest("/stars/create-invoice", { stars });
          if (!data.invoiceLink) throw new Error("Немає посилання на платіж");
          starsMessage.textContent = "Відкриваємо оплату...";
          tg.openInvoice(data.invoiceLink, status => {
            if (status === "paid") {
              starsMessage.textContent = "Оплачено! Коїни зарахуються протягом кількох секунд.";
              setTimeout(closeStarsPanel, 1200);
            } else if (status === "cancelled") {
              starsMessage.textContent = "Оплату скасовано.";
            } else if (status === "failed") {
              starsMessage.textContent = "Помилка оплати.";
            } else {
              starsMessage.textContent = "Статус: " + status;
            }
          });
        } catch (err) {
          starsMessage.textContent = err.message;
        } finally {
          starsConfirm.disabled = false;
          updateStarsPreview();
        }
      });


      connectFirebase();
      checkAdmin();
    </script>
</body>
</html>
