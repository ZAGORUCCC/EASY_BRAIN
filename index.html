<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Easy Brain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #050505;
        }

        body {
            overflow: hidden;
        }


        /* =========================
           MAIN MENU
        ========================= */

        #menuScreen {
            display: block;
            position: relative;
            width: 100%;
            height: 100vh;

            background:
                radial-gradient(
                    circle at 75% 20%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 75%
                );
        }


        /* =========================
           BASIC CASE
        ========================= */

        .case-card {
            position: absolute;
            left: 12px;
            top: 20px;
            width: 170px;
            z-index: 1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .case-card:active {
            transform: scale(0.97);
        }

        .case-image {
            display: block;
            width: 170px;
            height: auto;
            object-fit: contain;

            filter:
                drop-shadow(
                    0 8px 10px
                    rgba(0, 0, 0, 0.65)
                );
        }


        /* =========================
           BOTTOM MENU
        ========================= */

        .bottom-menu {
            position: absolute;
            left: 50%;
            bottom: 35px;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 20px;

            width: max-content;

            z-index: 100;
        }

        .menu-button {
            border: none;
            background: transparent;
            color: white;

            font-size: 24px;
            font-weight: 600;

            padding: 8px 10px;

            cursor: pointer;

            -webkit-tap-highlight-color:
                rgba(0, 122, 255, 0.35);
        }

        .menu-button:active {
            background:
                rgba(0, 122, 255, 0.25);

            border-radius: 10px;
        }


        /* =========================
           CASE SCREEN
        ========================= */

        #caseScreen {
            display: none;
            position: relative;

            width: 100%;
            height: 100vh;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 78%
                );

            overflow-y: auto;
            overflow-x: hidden;

            overscroll-behavior: contain;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================
           CASE HEADER
        ========================= */

        .case-header {
            position: relative;
            width: 100%;
            height: 90px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .case-back-button {
            position: absolute;

            left: 16px;
            top: 18px;

            z-index: 20;

            border: none;

            background:
                rgba(0, 0, 0, 0.32);

            color: white;

            font-size: 19px;
            font-weight: 600;

            padding: 10px 14px;

            border-radius: 12px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .case-back-button:active {
            transform: scale(0.96);
        }


        /* =========================
           BALANCE
        ========================= */

        .balance-box {
            position: fixed;

            right: 16px;
            top: 18px;

            z-index: 1000;

            min-width: 105px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 0 15px;

            background:
                rgba(10, 7, 18, 0.82);

            border:
                1px solid
                rgba(150, 70, 255, 0.65);

            border-radius: 14px;

            box-shadow:
                0 0 14px
                rgba(120, 30, 255, 0.18);

            font-size: 21px;
            font-weight: 700;

            color: white;

            backdrop-filter: blur(5px);
        }

        .balance-coin {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ffe96a,
                    #ffb300
                );

            color: #17100a;

            font-size: 20px;
            font-weight: 900;

            box-shadow:
                inset 0 0 0 2px
                rgba(255, 255, 255, 0.25);
        }

        #balanceAmount {
            min-width: 18px;
            text-align: center;
        }


        /* =========================
           OPEN AREA
           НОВЕ РОЗТАШУВАННЯ
        ========================= */

        .open-area {
            width: 100%;

            /*
              Великий простір над кнопкою.
              Сюди потім зможемо додати
              сам кейс, рулетку тощо.
            */
            height: 62vh;
            min-height: 430px;

            display: flex;

            /*
              Кнопка опускається
              в нижню частину цієї зони.
            */
            align-items: flex-end;
            justify-content: center;

            padding: 0 0 22px 0;
        }


        /* =========================
           OPEN BUTTON
        ========================= */

        .open-case-button {
            border: none;
            outline: none;

            background: transparent;

            padding: 0;
            margin: 0;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .open-case-button img {
            display: block;

            width: 150px;
            height: auto;

            object-fit: contain;
        }

        .open-case-button:active {
            transform: scale(0.94);
        }


        /* =========================
           BASE GRID
        ========================= */

        .bases-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            width: 100%;

            padding:
                0
                12px
                30px;
        }

        .base-item {
            width: 100%;
            overflow: hidden;
            border-radius: 12px;
        }

        .base-item img {
            display: block;

            width: 100%;
            height: auto;

            border-radius: 12px;
        }


        /* =========================
           PROFILE
        ========================= */

        #profileScreen {
            display: none;

            position: relative;

            width: 100%;
            height: 100vh;

            padding:
                35px
                25px;

            background:
                radial-gradient(
                    circle at 75% 20%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 75%
                );

            color: white;
        }

        .profile-box {
            display: flex;

            align-items: center;

            margin-top: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #333;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 36px;
            font-weight: bold;

            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }


        /* =========================
           PROFILE NAME + ID
        ========================= */

        .profile-user-info {
            margin-left: 20px;
        }

        .username {
            font-size: 27px;
            font-weight: bold;
        }

        .easy-brain-id {
            margin-top: 7px;

            font-size: 16px;
            font-weight: 600;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );
        }

        .back-button {
            display: inline-block;

            margin-top: 40px;

            color: white;

            font-size: 20px;
            font-weight: 600;

            background: transparent;

            border: none;

            padding: 0;

            cursor: pointer;
        }

    </style>
</head>


<body>


    <!-- GLOBAL BALANCE -->

    <div
        class="balance-box"
        id="balanceBox">

        <div class="balance-coin">
            E
        </div>

        <span id="balanceAmount">
            0
        </span>

    </div>



    <!-- =========================
         MAIN MENU
    ========================= -->

    <div id="menuScreen">


        <div
            class="case-card"
            id="basicCase">

            <img
                src="easy-brain-case.png"
                alt="Базовий кейс"
                class="case-image">

        </div>


        <div class="bottom-menu">

            <button
                type="button"
                class="menu-button"
                id="casesButton">

                Cases

            </button>


            <button
                type="button"
                class="menu-button"
                id="upgradeButton">

                Upgrade

            </button>


            <button
                type="button"
                class="menu-button"
                id="profileButton">

                Profile

            </button>

        </div>

    </div>



    <!-- =========================
         CASE SCREEN
    ========================= -->

    <div id="caseScreen">


        <div class="case-header">

            <button
                type="button"
                id="caseBackButton"
                class="case-back-button">

                ← Назад

            </button>

        </div>



        <!--
             ВЕЛИКА ЗОНА КЕЙСА
             Кнопка тепер знаходиться внизу
        -->

        <div class="open-area">

            <button
                type="button"
                id="openCaseButton"
                class="open-case-button">

                <img
                    src="open-button.png"
                    alt="Відкрити">

            </button>

        </div>



        <!-- =========================
             BASES
        ========================= -->

        <div class="bases-grid">


            <div class="base-item">

                <img
                    src="tralalelo-base.png"
                    alt="Tralalelo Base">

            </div>


            <div class="base-item">

                <img
                    src="rose-base.png"
                    alt="Rose Base">

            </div>


            <div class="base-item">

                <img
                    src="aquatic-base.png"
                    alt="Aquatic Base">

            </div>


            <div class="base-item">

                <img
                    src="honey-bee-base.png"
                    alt="Honey Bee Base">

            </div>


            <div class="base-item">

                <img
                    src="bunny-basket-base.png"
                    alt="Bunny Basket Base">

            </div>


            <div class="base-item">

                <img
                    src="taco-base.png"
                    alt="Taco Base">

            </div>


            <div class="base-item">

                <img
                    src="easter-base.png"
                    alt="Easter Base">

            </div>


            <div class="base-item">

                <img
                    src="lucky-base.png"
                    alt="Lucky Base">

            </div>


        </div>

    </div>



    <!-- =========================
         PROFILE
    ========================= -->

    <div id="profileScreen">


        <div class="profile-box">


            <div
                id="avatar"
                class="avatar">

                ?

            </div>


            <div class="profile-user-info">

                <div
                    id="username"
                    class="username">

                    Telegram User

                </div>


                <div
                    id="easyBrainId"
                    class="easy-brain-id">

                    ID: -------

                </div>

            </div>


        </div>


        <button
            type="button"
            id="backButton"
            class="back-button">

            ← Назад

        </button>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const menuScreen =
                    document.getElementById(
                        "menuScreen"
                    );


                const profileScreen =
                    document.getElementById(
                        "profileScreen"
                    );


                const caseScreen =
                    document.getElementById(
                        "caseScreen"
                    );


                const profileButton =
                    document.getElementById(
                        "profileButton"
                    );


                const backButton =
                    document.getElementById(
                        "backButton"
                    );


                const basicCase =
                    document.getElementById(
                        "basicCase"
                    );


                const caseBackButton =
                    document.getElementById(
                        "caseBackButton"
                    );


                const openCaseButton =
                    document.getElementById(
                        "openCaseButton"
                    );


                const balanceAmount =
                    document.getElementById(
                        "balanceAmount"
                    );


                const easyBrainId =
                    document.getElementById(
                        "easyBrainId"
                    );



                /* =====================
                   TELEGRAM USER
                ===================== */

                let telegramUserId =
                    "guest";



                /* =====================
                   EASY BRAIN USER ID
                ===================== */

                function generateEasyBrainId() {

                    const letters =
                        "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

                    const numbers =
                        "0123456789";


                    let characters =
                        [];


                    for (
                        let i = 0;
                        i < 4;
                        i++
                    ) {

                        const randomLetter =
                            letters[
                                Math.floor(
                                    Math.random() *
                                    letters.length
                                )
                            ];


                        characters.push(
                            randomLetter
                        );

                    }


                    for (
                        let i = 0;
                        i < 3;
                        i++
                    ) {

                        const randomNumber =
                            numbers[
                                Math.floor(
                                    Math.random() *
                                    numbers.length
                                )
                            ];


                        characters.push(
                            randomNumber
                        );

                    }


                    /*
                       Перемішуємо літери
                       та цифри між собою
                    */

                    for (
                        let i =
                            characters.length - 1;
                        i > 0;
                        i--
                    ) {

                        const j =
                            Math.floor(
                                Math.random() *
                                (i + 1)
                            );


                        const temp =
                            characters[i];


                        characters[i] =
                            characters[j];


                        characters[j] =
                            temp;

                    }


                    return characters.join("");

                }



                function getEasyBrainIdKey() {

                    return (
                        "easyBrainUserId_" +
                        telegramUserId
                    );

                }



                function loadEasyBrainId() {

                    const key =
                        getEasyBrainIdKey();


                    let savedId =
                        localStorage.getItem(
                            key
                        );


                    if (!savedId) {

                        savedId =
                            generateEasyBrainId();


                        localStorage.setItem(
                            key,
                            savedId
                        );

                    }


                    easyBrainId.textContent =
                        "ID: " +
                        savedId;

                }



                /* =====================
                   USER BALANCE
                ===================== */

                let balance =
                    0;



                function getBalanceKey() {

                    return (
                        "easyBrainBalance_" +
                        telegramUserId
                    );

                }



                function loadBalance() {

                    const savedBalance =
                        localStorage.getItem(
                            getBalanceKey()
                        );


                    if (savedBalance !== null) {

                        const parsedBalance =
                            Number(savedBalance);


                        if (
                            !Number.isNaN(
                                parsedBalance
                            )
                        ) {

                            balance =
                                parsedBalance;

                        }

                    }


                    updateBalanceDisplay();

                }



                function saveBalance() {

                    localStorage.setItem(
                        getBalanceKey(),
                        String(balance)
                    );

                }



                function updateBalanceDisplay() {

                    balanceAmount.textContent =
                        balance;

                }



                function addBalance(amount) {

                    balance += amount;

                    saveBalance();

                    updateBalanceDisplay();

                }



                function removeBalance(amount) {

                    if (balance < amount) {

                        return false;

                    }


                    balance -= amount;

                    saveBalance();

                    updateBalanceDisplay();


                    return true;

                }



                /* =====================
                   BASIC CASE CLICK
                ===================== */

                basicCase.addEventListener(
                    "click",
                    function () {

                        menuScreen.style.display =
                            "none";


                        profileScreen.style.display =
                            "none";


                        caseScreen.style.display =
                            "block";


                        caseScreen.scrollTop =
                            0;

                    }
                );



                /* =====================
                   CASE BACK
                ===================== */

                caseBackButton.addEventListener(
                    "click",
                    function () {

                        caseScreen.style.display =
                            "none";


                        menuScreen.style.display =
                            "block";

                    }
                );



                /* =====================
                   OPEN CASE
                ===================== */

                openCaseButton.addEventListener(
                    "click",
                    function () {

                        /*
                          Тут пізніше додамо
                          справжнє відкриття кейса.
                        */

                    }
                );



                /* =====================
                   PROFILE
                ===================== */

                profileButton.addEventListener(
                    "click",
                    function () {

                        menuScreen.style.display =
                            "none";


                        caseScreen.style.display =
                            "none";


                        profileScreen.style.display =
                            "block";

                    }
                );



                /* =====================
                   PROFILE BACK
                ===================== */

                backButton.addEventListener(
                    "click",
                    function () {

                        profileScreen.style.display =
                            "none";


                        caseScreen.style.display =
                            "none";


                        menuScreen.style.display =
                            "block";

                    }
                );



                /* =====================
                   TELEGRAM
                ===================== */

                if (
                    window.Telegram &&
                    window.Telegram.WebApp
                ) {


                    const tg =
                        window.Telegram.WebApp;


                    tg.ready();

                    tg.expand();



                    const user =
                        tg.initDataUnsafe &&
                        tg.initDataUnsafe.user;



                    if (user) {


                        telegramUserId =
                            String(user.id);



                        const username =
                            document.getElementById(
                                "username"
                            );


                        const avatar =
                            document.getElementById(
                                "avatar"
                            );



                        if (user.username) {

                            username.textContent =
                                "@" +
                                user.username;

                        } else {

                            username.textContent =
                                user.first_name ||
                                "Telegram User";

                        }



                        if (user.photo_url) {


                            const image =
                                document.createElement(
                                    "img"
                                );


                            image.src =
                                user.photo_url;


                            image.alt =
                                "Avatar";


                            avatar.textContent =
                                "";


                            avatar.appendChild(
                                image
                            );


                        } else {


                            avatar.textContent =
                                (
                                    user.first_name ||
                                    "U"
                                )
                                .charAt(0)
                                .toUpperCase();

                        }

                    }

                }


                /*
                   Завантажуємо баланс
                   та Easy Brain ID
                */

                loadBalance();

                loadEasyBrainId();


            }
        );

    </script>


</body>
</html>
