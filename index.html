<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Brain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        button {
            font-family: Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* ================= START ================= */

        #startScreen {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #ffffff;
        }

        .start-container {
            text-align: center;
        }

        .logo {
            margin: 0 0 60px 0;

            font-family: "Trebuchet MS", Arial, sans-serif;
            font-size: 58px;
            font-weight: 800;
            letter-spacing: 2px;

            color: #000000;
        }

        #startButton {
            width: 300px;
            height: 110px;

            border: none;
            border-radius: 25px;

            background: #32cd65;
            color: #ffffff;

            font-size: 36px;
            font-weight: bold;

            cursor: pointer;

            touch-action: manipulation;
        }

        #startButton:active {
            transform: scale(0.97);
        }

        /* ================= MENU ================= */

        #menuScreen {
            display: none;

            position: relative;

            width: 100%;
            height: 100vh;

            background:
                radial-gradient(
                    circle at 75% 20%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 75%
                );
        }

        .bottom-menu {
            position: absolute;

            left: 50%;
            bottom: 35px;

            transform: translateX(-50%);

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 20px;
        }

        .menu-button {
            border: none;
            background: transparent;

            color: #ffffff;

            font-size: 24px;
            font-weight: 600;

            padding: 8px 10px;

            cursor: pointer;

            touch-action: manipulation;
        }

        /* ================= PROFILE ================= */

        #profileScreen {
            display: none;

            width: 100%;
            height: 100vh;

            padding: 35px 25px;

            background:
                radial-gradient(
                    circle at 75% 20%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 75%
                );

            color: #ffffff;
        }

        .profile-header {
            display: flex;
            align-items: center;

            max-width: 500px;
            margin: 20px auto 0;
        }

        .avatar {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #333333;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #ffffff;

            font-size: 36px;
            font-weight: bold;

            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .profile-info {
            margin-left: 20px;
        }

        .profile-name {
            margin: 0 0 8px 0;

            font-size: 27px;
            font-weight: bold;
        }

        .profile-id {
            margin: 0;

            font-size: 17px;
            color: #bdbdbd;
        }

<body>

    <!-- START -->

    <div id="startScreen">

        <div class="start-container">

            <h1 class="logo">
                🧠 Easy Brain
            </h1>

            <button id="startButton" type="button">
                Start
            </button>

        </div>

    </div>


    <!-- MENU -->

    <div id="menuScreen">

        <div class="bottom-menu">

            <button id="casesButton" class="menu-button" type="button">
                Cases
            </button>

            <button id="upgradeButton" class="menu-button" type="button">
                Upgrade
            </button>

            <button id="profileButton" class="menu-button" type="button">
                Profile
            </button>

        </div>

    </div>


    <!-- PROFILE -->

    <div id="profileScreen">

        <div class="profile-header">

            <div id="avatar" class="avatar">
                ?
            </div>

            <div class="profile-info">

                <h2 id="profileName" class="profile-name">
                    Telegram User
                </h2>

                <p class="profile-id">
                    ID:
                    <span id="profileId">Не визначено</span>
                </p>

            </div>

        </div>

        <button id="backButton" class="back-button" type="button">
            ← Назад
        </button>

    </div>


    <script>
        "use strict";

        /* ================= TELEGRAM ================= */

        const tg =
            window.Telegram &&
            window.Telegram.WebApp
                ? window.Telegram.WebApp
                : null;


        if (tg) {
            tg.ready();
            tg.expand();
        }


        /* ================= ELEMENTS ================= */

        const startScreen =
            document.getElementById("startScreen");

        const menuScreen =
            document.getElementById("menuScreen");

        const profileScreen =
            document.getElementById("profileScreen");

        const startButton =
            document.getElementById("startButton");

        const profileButton =
            document.getElementById("profileButton");

        const backButton =
            document.getElementById("backButton");

        const profileName =
            document.getElementById("profileName");

        const profileId =
            document.getElementById("profileId");

        const avatar =
            document.getElementById("avatar");


        /* ================= START ================= */

        startButton.addEventListener("click", function () {

            startScreen.style.display = "none";
            menuScreen.style.display = "block";

        });


        /* ================= TELEGRAM USER ================= */

        function getUser() {

            if (!tg) {
                return null;
            }

            if (!tg.initDataUnsafe) {
                return null;
            }

            if (!tg.initDataUnsafe.user) {
                return null;
            }

            return tg.initDataUnsafe.user;

        }


        /* ================= PROFILE ================= */

        function openProfile() {

            menuScreen.style.display = "none";
            profileScreen.style.display = "block";


            const user = getUser();


            if (!user) {

                profileName.textContent = "Telegram User";
                profileId.textContent = "Не визначено";
                avatar.textContent = "?";

                return;

            }


            /* ID */

            if (user.id) {
                profileId.textContent = String(user.id);
            }


            /* NAME */

            if (user.username) {
[04.10.2026 21:58] @FarmBrainrots_bot: profileName.textContent =
                    "@" + user.username;

            } else {

                let fullName =
                    user.first_name || "";

                if (user.last_name) {

                    fullName +=
                        " " + user.last_name;

                }

                profileName.textContent =
                    fullName.trim() || "Telegram User";

            }


            /* AVATAR */

            if (user.photo_url) {

                avatar.innerHTML = "";

                const image =
                    document.createElement("img");

                image.src = user.photo_url;
                image.alt = "Avatar";

                avatar.appendChild(image);

            } else {

                const firstLetter =
                    (user.first_name || "U")
                        .charAt(0)
                        .toUpperCase();

                avatar.textContent = firstLetter;

            }

        }


        /* ================= CLOSE PROFILE ================= */

        function closeProfile() {

            profileScreen.style.display = "none";
            menuScreen.style.display = "block";

        }


        /* ================= BUTTONS ================= */

        profileButton.addEventListener(
            "click",
            openProfile
        );


        backButton.addEventListener(
            "click",
            closeProfile
        );

    </script>

</body>
</html>
