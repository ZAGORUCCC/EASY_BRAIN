<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Easy Brain</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: white;
        }

        .container {
            text-align: center;
        }

        h1 {
            margin: 0 0 60px 0;
            font-family: "Trebuchet MS", Arial, sans-serif;
            font-size: 58px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .start-button {
            width: 300px;
            height: 110px;
            border: none;
            border-radius: 25px;
            background: #32cd65;
            color: white;
            font-size: 36px;
            font-weight: bold;
            cursor: pointer;
        }

        .start-button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>🧠 Easy Brain</h1>

        <button class="start-button">Start</button>
    </div>

</body>
</html>
