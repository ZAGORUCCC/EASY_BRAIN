<button class="start-button" id="startButton">
                Start
            </button>

        </div>

    </div>


    <!-- ЕКРАН МЕНЮ -->
    <div id="menuScreen">

        <div class="bottom-menu">

            <button class="menu-button" id="casesButton">
                Cases
            </button>

            <button class="menu-button" id="upgradeButton">
                Upgrade
            </button>

            <button class="menu-button" id="profileButton">
                Profile
            </button>

        </div>

    </div>


    <!-- ПРОФІЛЬ -->
    <div id="profileScreen">

        <div class="profile-header">

            <img
                id="profileAvatar"
                class="profile-avatar"
                src=""
                alt="Avatar"
            >

            <div class="profile-info">

                <h2 id="profileName" class="profile-name">
                    User
                </h2>

                <p class="profile-id">
                    ID: <span id="profileId">—</span>
                </p>

            </div>

        </div>

        <button class="back-button" id="backButton">
            ← Назад
        </button>

    </div>


    <script>

        const startButton = document.getElementById("startButton");

        const startScreen = document.getElementById("startScreen");
        const menuScreen = document.getElementById("menuScreen");
        const profileScreen = document.getElementById("profileScreen");

        const profileButton = document.getElementById("profileButton");
        const backButton = document.getElementById("backButton");

        const profileAvatar = document.getElementById("profileAvatar");
        const profileName = document.getElementById("profileName");
        const profileId = document.getElementById("profileId");


        /* TELEGRAM MINI APP */

        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
        }


        /* START */

        startButton.addEventListener("click", function() {

            startScreen.style.display = "none";
            menuScreen.style.display = "block";

        });


        /* ПРОФІЛЬ */

        profileButton.addEventListener("click", function() {

            menuScreen.style.display = "none";
            profileScreen.style.display = "block";

            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {

                const user = tg.initDataUnsafe.user;

                profileId.textContent = user.id;

                if (user.username) {
                    profileName.textContent = "@" + user.username;
                } else {
                    profileName.textContent =
                        (user.first_name || "") +
                        (user.last_name ? " " + user.last_name : "");
                }

                if (user.photo_url) {
                    profileAvatar.src = user.photo_url;
                } else {
                    profileAvatar.src =
                        "https://ui-avatars.com/api/?name=" +
                        encodeURIComponent(user.first_name || "User");
                }

            } else {

                profileName.textContent = "Telegram User";
                profileId.textContent = "Не визначено";

            }

        });


        /* НАЗАД */

        backButton.addEventListener("click", function() {

            profileScreen.style.display = "none";
            menuScreen.style.display = "block";

        });

    </script>

</body>
</html>
