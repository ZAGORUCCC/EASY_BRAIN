<script>

    /* TELEGRAM */

    if (
        window.Telegram &&
        window.Telegram.WebApp
    ) {

        const tg =
            window.Telegram.WebApp;

        tg.ready();
        tg.expand();


        /* КОРИСТУВАЧ */

        const user =
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user;


        if (user) {

            const username =
                document.getElementById("username");

            const avatar =
                document.getElementById("avatar");


            /* НІК */

            if (user.username) {

                username.textContent =
                    "@" + user.username;

            } else {

                username.textContent =
                    user.first_name ||
                    "Telegram User";

            }


            /* АВАТАР */

            if (user.photo_url) {

                avatar.innerHTML =
                    '<img src="' +
                    user.photo_url +
                    '" alt="Avatar">';

            } else {

                avatar.textContent =
                    (user.first_name || "U")
                    .charAt(0)
                    .toUpperCase();

            }

        }

    }

</script>
