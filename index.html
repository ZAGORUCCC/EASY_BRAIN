<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Easy Brain</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            font-family: Arial, sans-serif;

            background: #050505;
        }

        body {
            overflow: hidden;
        }


        /* =========================
           MAIN MENU
        ========================= */

        #menuScreen {
            display: block;

            position: relative;

            width: 100%;
            height: 100vh;

            background:
                radial-gradient(
                    circle at 75% 20%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 75%
                );
        }


        /* =========================
           BASIC CASE
        ========================= */

        .case-card {
            position: absolute;

            left: 12px;
            top: 20px;

            width: 170px;

            z-index: 1;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .case-card:active {
            transform: scale(0.97);
        }

        .case-image {
            display: block;

            width: 170px;
            height: auto;

            object-fit: contain;

            filter:
                drop-shadow(
                    0 8px 10px
                    rgba(0, 0, 0, 0.65)
                );
        }


        /* =========================
           BOTTOM MENU
        ========================= */

        .bottom-menu {
            position: absolute;

            left: 50%;
            bottom: 35px;

            transform: translateX(-50%);

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 20px;

            width: max-content;

            z-index: 100;
        }

        .menu-button {
            border: none;

            background: transparent;

            color: white;

            font-size: 24px;
            font-weight: 600;

            padding: 8px 10px;

            cursor: pointer;

            -webkit-tap-highlight-color:
                rgba(0, 122, 255, 0.35);
        }

        .menu-button:active {
            background:
                rgba(0, 122, 255, 0.25);

            border-radius: 10px;
        }


        /* =========================
           CASE SCREEN
        ========================= */

        #caseScreen {
            display: none;

            position: relative;

            width: 100%;
            height: 100vh;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 15%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 78%
                );

            overflow-y: auto;
            overflow-x: hidden;

            overscroll-behavior: contain;

            -webkit-overflow-scrolling: touch;
        }


        /* =========================
           CASE HEADER
        ========================= */

        .case-header {
            position: relative;

            width: 100%;
            height: 90px;
        }


        /* =========================
           BACK BUTTON
        ========================= */

        .case-back-button {
            position: absolute;

            left: 16px;
            top: 18px;

            z-index: 20;

            border: none;

            background:
                rgba(0, 0, 0, 0.32);

            color: white;

            font-size: 19px;
            font-weight: 600;

            padding: 10px 14px;

            border-radius: 12px;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .case-back-button:active {
            transform: scale(0.96);
        }


        /* =========================
           BALANCE
        ========================= */

        .balance-box {
            position: fixed;

            right: 16px;
            top: 18px;

            z-index: 1000;

            min-width: 105px;
            height: 48px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 9px;

            padding: 0 15px;

            background:
                rgba(10, 7, 18, 0.82);

            border:
                1px solid
                rgba(150, 70, 255, 0.65);

            border-radius: 14px;

            box-shadow:
                0 0 14px
                rgba(120, 30, 255, 0.18);

            font-size: 21px;
            font-weight: 700;

            color: white;

            backdrop-filter: blur(5px);
        }

        .balance-coin {
            display: flex;

            align-items: center;
            justify-content: center;

            width: 30px;
            height: 30px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #ffe96a,
                    #ffb300
                );

            color: #17100a;

            font-size: 20px;
            font-weight: 900;

            box-shadow:
                inset 0 0 0 2px
                rgba(255, 255, 255, 0.25);
        }

        #balanceAmount {
            min-width: 18px;

            text-align: center;
        }


        /* =========================
           OPEN AREA
        ========================= */

        .open-area {
            width: 100%;

            height: 62vh;
            min-height: 430px;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: flex-end;

            padding: 0 0 22px 0;
        }


        /* =========================
           RANDOM BASE WINDOW
        ========================= */

        .base-showcase {
            position: relative;

            width: calc(100% - 24px);
            max-width: 620px;

            height: 235px;

            margin-bottom: 20px;

            overflow: hidden;

            border-radius: 18px;

            background:
                linear-gradient(
                    180deg,
                    rgba(42, 19, 67, 0.88),
                    rgba(12, 8, 18, 0.94)
                );

            border:
                1px solid
                rgba(161, 82, 255, 0.35);

            box-shadow:
                inset 0 0 35px
                rgba(107, 34, 174, 0.15),
                0 8px 28px
                rgba(0, 0, 0, 0.35);
        }


        /* =========================
           EDGE DARKENING
        ========================= */

        .base-showcase::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            background: linear-gradient(90deg,
                rgba(8, 5, 14, 1) 0%,
                rgba(8, 5, 14, .98) 12%,
                rgba(8, 5, 14, .76) 22%,
                rgba(8, 5, 14, 0) 38%,
                rgba(8, 5, 14, 0) 62%,
                rgba(8, 5, 14, .76) 78%,
                rgba(8, 5, 14, .98) 88%,
                rgba(8, 5, 14, 1) 100%);
        }

        /* Безперервна стрічка: сусідні бази без CSS-проміжків. */
        .base-track {
            position: absolute;
            inset: 0 auto 0 0;
            display: flex;
            align-items: center;
            gap: 0;
            width: max-content;
            height: 100%;
            will-change: transform;
        }
        .base-track img {
            display: block;
            flex: 0 0 160px;
            width: 160px;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,.4));
        }

        /* =========================
           EASY BRAIN CENTER POINTER
        ========================= */

        .center-pointer {
            position: absolute;

            left: 50%;
            top: 0;

            width: 4px;
            height: 100%;

            transform: translateX(-50%);

            z-index: 100;

            pointer-events: none;

            background:
                linear-gradient(
                    180deg,
                    #ffffff 0%,
                    #bca4ff 22%,
                    #8a5cff 50%,
                    #65c7ff 78%,
                    #ffffff 100%
                );

            box-shadow:
                0 0 5px rgba(255,255,255,.95),
                0 0 12px rgba(130,88,255,.95),
                0 0 22px rgba(70,160,255,.60);
        }


        /* TOP ARROW */

        .center-pointer::before {
            content: "";

            position: absolute;

            left: 50%;
            top: 0;

            transform: translateX(-50%);

            width: 0;
            height: 0;

            border-left: 18px solid transparent;
            border-right: 18px solid transparent;

            border-top: 24px solid #ffffff;

            filter:
                drop-shadow(
                    0 4px 5px
                    rgba(126, 92, 255, 0.85)
                );
        }


        /* BOTTOM ARROW */

        .center-pointer::after {
            content: "";

            position: absolute;

            left: 50%;
            bottom: 0;

            transform: translateX(-50%);

            width: 0;
            height: 0;

            border-left: 18px solid transparent;
            border-right: 18px solid transparent;

            border-bottom: 24px solid #ffffff;

            filter:
                drop-shadow(
                    0 -4px 5px
                    rgba(85, 164, 255, 0.85)
                );
        }


        /* =========================
           OPEN BUTTON
        ========================= */

        .open-case-button {
            border: none;
            outline: none;

            background: transparent;

            padding: 0;
            margin: 0;

            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        .open-case-button img {
            display: block;

            width: 150px;
            height: auto;

            object-fit: contain;
        }

        .open-case-button:active {
            transform: scale(0.94);
        }


        /* =========================
           BASE GRID
        ========================= */

        .bases-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 12px;

            width: 100%;

            padding:
                0
                12px
                30px;
        }

        .base-item {
            width: 100%;

            overflow: hidden;

            border-radius: 12px;
        }

        .base-item img {
            display: block;

            width: 100%;
            height: auto;

            border-radius: 12px;
        }


        /* =========================
           PROFILE
        ========================= */

        #profileScreen {
            display: none;

            position: relative;

            width: 100%;
            height: 100vh;

            padding:
                35px
                25px;

            background:
                radial-gradient(
                    circle at 75% 20%,
                    #3b155c 0%,
                    #160c24 35%,
                    #050505 75%
                );

            color: white;
        }

        .profile-box {
            display: flex;

            align-items: center;

            margin-top: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            background: #333;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden;

            font-size: 36px;
            font-weight: bold;

            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;

            object-fit: cover;
        }


        /* =========================
           PROFILE NAME + ID
        ========================= */

        .profile-user-info {
            margin-left: 20px;
        }

        .username {
            font-size: 27px;

            font-weight: bold;
        }

        .easy-brain-id {
            margin-top: 7px;

            font-size: 16px;
            font-weight: 600;

            color:
                rgba(
                    255,
                    255,
                    255,
                    0.65
                );
        }


        .back-button {
            display: inline-block;

            margin-top: 40px;

            color: white;

            font-size: 20px;
            font-weight: 600;

            background: transparent;

            border: none;

            padding: 0;

            cursor: pointer;
        }


        /* =========================
           SMALL PHONES
        ========================= */

        @media (max-width: 430px) {

            .base-showcase {
                height: 215px;
            }

            .center-pointer {
                width: 3px;
            }

            .center-pointer::before {
                border-left-width: 15px;
                border-right-width: 15px;
                border-top-width: 21px;
            }

            .center-pointer::after {
                border-left-width: 15px;
                border-right-width: 15px;
                border-bottom-width: 21px;
            }

        }


        /* EASY BRAIN ADMIN PANEL */
        #adminOrb { display:none; position:fixed; left:calc(50% - 23px); top:78px; width:46px; height:46px; z-index:3000; border-radius:50%; border:1px solid #8751d5; background:#09070e; color:#bb74ff; box-shadow:0 0 15px #7c39d870; align-items:center; justify-content:center; cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none; padding:0; }
        #adminOrb svg { width:26px; height:26px; pointer-events:none; filter:drop-shadow(0 0 5px #ad62ff); }
        #adminOrb.dragging { cursor:grabbing; }
        #adminOverlay { display:none; position:fixed; inset:0; z-index:4000; background:rgba(0,0,0,.64); align-items:center; justify-content:center; padding:16px; }
        #adminOverlay.visible { display:flex; }
        .admin-panel { width:min(92vw,510px); max-height:90dvh; overflow-y:auto; background:#09080e; color:#f4edff; border:1px solid #7231a8; border-radius:19px; box-shadow:0 15px 55px #000b, 0 0 25px #6d21aa40; padding:22px; }
        .admin-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:26px; }
        .admin-head h2 { margin:0; font-size:26px; color:#e3c6ff; }
        #adminClose { width:39px; height:39px; border:0; border-radius:10px; background:#df1735; color:white; font-size:28px; font-weight:800; cursor:pointer; }
        .admin-panel label { display:block; font-size:16px; font-weight:700; margin:17px 0 8px; }
        .admin-panel input { width:100%; padding:15px; border:1px solid #7430bd; border-radius:11px; background:#171222; color:white; font-size:17px; outline:none; }
        .admin-panel input:focus { border-color:#c184ff; }
        .admin-bottom { display:flex; justify-content:flex-end; margin-top:25px; }
        #adminStart { border:0; border-radius:11px; background:linear-gradient(#0bd55e,#02963d); color:white; padding:13px 31px; font-size:19px; font-weight:800; cursor:pointer; }
        #adminStart:disabled { opacity:.55; cursor:wait; }
        #adminMessage { min-height:20px; font-size:14px; line-height:1.4; margin-top:15px; color:#c7b8d9; }

    </style>
</head>

      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.4 2 4.7 13h6.4L10.6 22 19.3 10.7h-6.4L13.4 2Z"/></svg>

    <!-- Налаштування Firebase: заповнити лише публічні значення з Firebase Console. -->
    <script>
      window.EASY_BRAIN_CONFIG = {
        workerUrl: "https://easy-brain-api.m-zahorui7.workers.dev",
        firebase: {
          apiKey: "AIzaSyBcknkOZkPYWAYOOtMDRATY6uwosIbIBjc",
          authDomain: "easy-brain-6d4f9.firebaseapp.com",
          projectId: "easy-brain-6d4f9",
          storageBucket: "easy-brain-6d4f9.firebasestorage.app",
          messagingSenderId: "656285514139",
          appId: "1:656285514139:web:68ccd78028b018635f893e"
        }
      };
    </script>

    <script type="module">
      const $ = id => document.getElementById(id);
      const menu = $("menuScreen"), profile = $("profileScreen"), casePage = $("caseScreen");
      const showcase = $("baseShowcase"), track = $("baseTrack");
      const idLabel = $("easyBrainId"), balanceLabel = $("balanceAmount");
      const cfg = window.EASY_BRAIN_CONFIG;

      const images = [
        "tralalelo-base-clean.png", "rose-base-clean.png",
        "aquatic-base-clean.png", "honey-bee-base-clean.png",
        "bunny-basket-base-clean.png", "taco-base-clean.png",
        "easter-base-clean.png", "lucky-base-clean.png"
      ];
      images.forEach(src => { const img = new Image(); img.src = src; });
      let previous = -1;
      function nextImage() {
        let index = Math.floor(Math.random() * images.length);
        if (index === previous) index = (index + 1) % images.length;
        previous = index;
        return images[index];
      }

      // Кожен елемент займає рівно 160px. Наступний починається одразу за ним.
      const ITEM_WIDTH = 160;
      const SPEED = 95; // пікселів за секунду
      let animationFrame = null, lastFrame = 0, offset = 0;
      function addImage() {
        const image = document.createElement("img");
        image.src = nextImage();
        image.alt = "Base";
        image.draggable = false;
        track.appendChild(image);
      }
      function fillTrack() {
        const required = Math.ceil(showcase.clientWidth / ITEM_WIDTH) + 3;
        while (track.children.length < required) addImage();
      }
      function frame(time) {
        if (lastFrame) offset += SPEED * Math.min((time - lastFrame) / 1000, .05);
        lastFrame = time;
        while (offset >= ITEM_WIDTH) {
          offset -= ITEM_WIDTH;
          track.firstElementChild?.remove();
          addImage();
        }
        fillTrack();
        track.style.transform = `translate3d(${-offset}px, 0, 0)`;
        animationFrame = requestAnimationFrame(frame);
      }
      function startShowcase() {
        stopShowcase();
        offset = 0;
        track.style.transform = "translate3d(0,0,0)";
        fillTrack();
        animationFrame = requestAnimationFrame(frame);
      }
      function stopShowcase() {
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = null;
        lastFrame = 0;
        track.replaceChildren();
      }

      $("basicCase").addEventListener("click", () => {
        menu.style.display = "none";
        profile.style.display = "none";
        casePage.style.display = "block";
        casePage.scrollTop = 0;
        startShowcase();
      });
      $("caseBackButton").addEventListener("click", () => {
        stopShowcase();
        casePage.style.display = "none";
        menu.style.display = "block";
      });
      $("profileButton").addEventListener("click", () => {
        stopShowcase();
        menu.style.display = "none";
        casePage.style.display = "none";
        profile.style.display = "block";
      });
      $("backButton").addEventListener("click", () => {
        profile.style.display = "none";
        menu.style.display = "block";
      });
      // Кнопка відкриття поки не витрачає E та не видає призи.
      $("openCaseButton").addEventListener("click", () => {});

      const tg = window.Telegram?.WebApp;
      tg?.ready();
      tg?.expand();
      const tgUser = tg?.initDataUnsafe?.user;
      if (tgUser) {
        $("username").textContent = tgUser.username
          ? "@" + tgUser.username : (tgUser.first_name || "Telegram User");
        if (tgUser.photo_url) {
          const avatarImage = document.createElement("img");
          avatarImage.src = tgUser.photo_url;
          avatarImage.alt = "Avatar";
          $("avatar").replaceChildren(avatarImage);
        } else {
          $("avatar").textContent = (tgUser.first_name || "U")[0].toUpperCase();
        }
      }

      // Постійний 7-символьний ID з Firebase UID. Без старих localStorage ID.
      // Колізії для короткого ID теоретично можливі; для суворої унікальності
      // потрібна окрема серверна реєстрація з перевіркою зайнятості.
      async function makeEasyBrainId(uid) {
        const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(uid)));
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ", digits = "0123456789";
        return letters[hash[0] % 26] + letters[hash[1] % 26] +
          digits[hash[2] % 10] + letters[hash[3] % 26] +
          digits[hash[4] % 10] + letters[hash[5] % 26] + digits[hash[6] % 10];
      }

      async function connectFirebase() {
        idLabel.textContent = "ID: підключення...";
        balanceLabel.textContent = "0";
        if (!tg?.initData || !tgUser) {
          idLabel.textContent = "ID: відкрийте через Telegram";
          return;
        }
        if (cfg.workerUrl.includes("PASTE_") ||
            Object.values(cfg.firebase).some(value => !value || value.includes("PASTE_"))) {
          idLabel.textContent = "ID: налаштуйте Firebase";
          return;
        }
        try {
          const [{ initializeApp }, auth, firestore] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js"),
            import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js")
          ]);
          const app = initializeApp(cfg.firebase);
          const response = await fetch(cfg.workerUrl.replace(/\/$/, "") + "/auth/telegram", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ initData: tg.initData })
          });
          if (!response.ok) throw new Error("Telegram API: " + response.status);
          const result = await response.json();
          if (!result.verified || !result.customToken) throw new Error("Немає Firebase token");
          const credential = await auth.signInWithCustomToken(auth.getAuth(app), result.customToken);
          const uid = credential.user.uid;
          const db = firestore.getFirestore(app);
          const userDoc = firestore.doc(db, "users", uid);
          const snapshot = await firestore.getDoc(userDoc);
          if (!snapshot.exists()) {
            // Перший вхід: 0 E. Правила Firestore мають забороняти клієнту
            // змінювати баланс після створення документа.
            await firestore.setDoc(userDoc, {
              easyBrainId: await makeEasyBrainId(uid),
              balance: 0
            });
          }
          firestore.onSnapshot(userDoc, snap => {
            if (!snap.exists()) return;
            const data = snap.data();
            idLabel.textContent = "ID: " + (data.easyBrainId || "-------");
            balanceLabel.textContent = String(data.balance ?? 0);
          }, error => {
            console.error("Firestore:", error);
            idLabel.textContent = "ID: помилка доступу";
          });
        } catch (error) {
          console.error("Easy Brain login:", error);
          idLabel.textContent = "ID: помилка підключення";
        }
      }

      // ADMIN: Telegram initData надсилається серверу для перевірки прав.
      const adminOrb = $("adminOrb"), adminOverlay = $("adminOverlay");
      const adminForm = $("adminForm"), adminMessage = $("adminMessage");
      let adminAuthorized = false;
      const adminApi = path => cfg.workerUrl.replace(/\/$/, "") + path;
      async function adminRequest(path, extra = {}) {
        const response = await fetch(adminApi(path), {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData, ...extra })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "Помилка сервера: " + response.status);
        return result;
      }
      async function checkAdmin() {
        if (!tg?.initData) return;
        try {
          const status = await adminRequest("/admin/status");
          adminAuthorized = status.admin === true;
          adminOrb.style.display = adminAuthorized ? "flex" : "none";
        } catch (err) { console.warn("Admin access:", err.message); }
      }
      function closeAdmin() { adminOverlay.classList.remove("visible"); }
      $("adminClose").addEventListener("click", closeAdmin);
      adminOverlay.addEventListener("click", e => { if (e.target === adminOverlay) closeAdmin(); });
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeAdmin(); });
      let drag = null;
      adminOrb.addEventListener("pointerdown", e => {
        if (!adminAuthorized) return;
        drag = { x:e.clientX, y:e.clientY, left:adminOrb.offsetLeft, top:adminOrb.offsetTop, moved:false };
        adminOrb.setPointerCapture(e.pointerId);
      });
      adminOrb.addEventListener("pointermove", e => {
        if (!drag) return;
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.hypot(dx, dy) > 7) drag.moved = true;
        if (!drag.moved) return;
        adminOrb.classList.add("dragging");
        const x = Math.max(0, Math.min(window.innerWidth - adminOrb.offsetWidth, drag.left + dx));
        const y = Math.max(0, Math.min(window.innerHeight - adminOrb.offsetHeight, drag.top + dy));
        adminOrb.style.left = x + "px";
        adminOrb.style.top = y + "px";
      });
      adminOrb.addEventListener("pointerup", () => {
        if (!drag) return;
        const moved = drag.moved; drag = null;
        adminOrb.classList.remove("dragging");
        if (!moved && adminAuthorized) { adminMessage.textContent = ""; adminOverlay.classList.add("visible"); }
      });
      adminOrb.addEventListener("pointercancel", () => { drag = null; adminOrb.classList.remove("dragging"); });
      adminForm.addEventListener("submit", async e => {
        e.preventDefault();
        if (!adminAuthorized) return;
        const targetId = $("adminTargetId").value.trim().toUpperCase();
        const amount = Number($("adminCoins").value);
        if (!/^[A-Z0-9]{7}$/.test(targetId) || !Number.isSafeInteger(amount) || amount < 1 || amount > 1000000) {
          adminMessage.textContent = "Перевір ID (7 символів) і кількість (1–1 000 000).";
          return;
        }
        const button = $("adminStart"); button.disabled = true;
        adminMessage.textContent = "Нарахування...";
        try {
          const result = await adminRequest("/admin/add-coins", { targetId, amount });
          adminMessage.textContent = `Готово! Додано ${amount} E. Новий баланс: ${result.balance} E.`;
        } catch (err) { adminMessage.textContent = "Помилка: " + err.message; }
        finally { button.disabled = false; }
      });

      connectFirebase();
      checkAdmin();
    </script>
</body>
</html>
